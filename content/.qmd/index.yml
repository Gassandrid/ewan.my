global_context: Ewan's local knowledge system. The vault collection is human-authored canon; the sessions collection contains compact agent-generated retrieval pointers and must not override current Vault evidence.
collections:
  vault:
    path: /Users/gassandrid/VAULT
    pattern: "**/*.md"
    ignore:
      - .agents/**
      - .claude/**
      - .git/**
      - .obsidian/**
      - .pi-lens/**
      - .qmd/**
      - .rss-dashboard-data/**
      - .smart-env/**
      - Private/Agent Map/**
      - Private/Agent Memory/**
      - Private/Agent Sessions/**
      - Private/Claude Memory/**
    includeByDefault: true
    context:
      "": "Human-authored Obsidian Vault: canonical evidence for Ewan's writing, interests, decisions, and cognitive state."
  sessions:
    path: /Users/gassandrid/VAULT/Private/Agent Sessions
    pattern: "**/*.md"
    includeByDefault: false
    context:
      "": "Compact Codex and Pi session indexes: operational retrieval pointers only, never authority over current Vault notes."
models:
  embed: hf:ggml-org/embeddinggemma-300M-GGUF/embeddinggemma-300M-Q8_0.gguf
  generate: hf:tobil/qmd-query-expansion-1.7B-gguf/qmd-query-expansion-1.7B-q4_k_m.gguf
  rerank: hf:ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF/qwen3-reranker-0.6b-q8_0.gguf
